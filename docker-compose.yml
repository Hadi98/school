services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "@Had170645382"
      MYSQL_DATABASE: db-school
    ports:
      - "3307:3306"

  app:
    image: school-app:latest
    container_name: school-app
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/db-school?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@Had170645382"
    depends_on:
      - db