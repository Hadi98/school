services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "@Hadi70645382"
      MYSQL_DATABASE: db-school
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: school-app:latest
    container_name: school-app
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/db-school?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@Hadi70645382"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure